# Shared build settings only. The server's address and the Firebase values are never here: they come from
# ~/.gradle/gradle.properties (or -P on the command line), as gom.<flavour>.baseUrl and gom.<flavour>.firebase.* (README).
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
